name: mced-cfdna
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  # Core scientific stack
  - numpy>=1.23.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  - pyarrow>=12.0.0
  # Machine learning & modeling
  - scikit-learn>=1.3.0
  - xgboost>=2.0.0
  - lightgbm>=4.0.0
  - pytorch>=2.1.0
  - cpuonly  # Or pytorch-cuda for GPU deployment
  # Bioinformatics & NGS tools
  - pysam>=0.21.0
  - biopython>=1.81
  - samtools>=1.18
  - bwa>=0.7.17
  - bedtools>=2.31.0
  # Workflow & testing
  - snakemake>=7.32.0
  - pytest>=7.4.0
  - pyyaml>=6.0.0
  - requests>=2.31.0
  - tqdm>=4.66.0
  # Visualization & dashboard
  - streamlit>=1.30.0
  - plotly>=5.18.0
  - matplotlib>=3.8.0
  - seaborn>=0.13.0
  # Pip specific packages
  - pip:
      - finaletoolkit>=0.3.0
